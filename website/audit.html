<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Management - AI-FSR</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<script>if(!localStorage.getItem('fsr_token'))window.location.href='login.html';</script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="row"><div></div><div class="btn-group">
      <button class="btn btn-outline" onclick="loadAudits()">Refresh</button>
      <button class="btn btn-primary" onclick="toast('Schedule form coming soon')">+ Schedule Audit</button>
    </div></div>
    <div class="card">
      <h3 style="margin-bottom:12px">Audit Schedule &amp; History</h3>
      <div id="auditTable">Loading...</div>
    </div>
  </main>
</div>
<script src="api.js"></script>`n<script src="app.js"></script>
<script>
renderShell(4,'Audit Management','Manage internal, external, and surprise audits with AI-assisted reviews','Audit');

async function loadAudits(){
  const el=document.getElementById('auditTable');
  try{
    const data=await API.audits.list();
    const audits=data.audits||[];
    if(!audits.length){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted-foreground)">No audits found for your organization</div>';return;}
    el.innerHTML=`<table><tr><th>Audit ID</th><th>Type</th><th>Plant / Unit</th><th>Date</th><th>Score</th><th>Status</th></tr>${audits.map(a=>{
      const sc=a.score||'—';
      const scStyle=a.score?(a.score>=80?'font-weight:600':a.score>=60?'font-weight:600;color:var(--warning)':'font-weight:600;color:var(--danger)'):'';
      const cls=a.status==='Completed'||a.status==='Compliant'?'green':a.status==='Scheduled'?'blue':a.status==='In Progress'?'yellow':'gray';
      return `<tr><td style="color:var(--primary);font-weight:500">${esc(a.audit_id||'AUD-'+a.id)}</td><td>${esc(a.type||'Internal')}</td><td>${esc(a.plant||a.org_name||'')}</td><td>${esc(a.date||a.created_at||'')}</td><td style="${scStyle}">${sc}</td><td><span class="pill ${cls}">${esc(a.status||'Scheduled')}</span></td></tr>`;
    }).join('')}</table>`;
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--danger)">Failed to load audits</div>';}
}
function esc(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadAudits();
</script>
</body>
</html>
