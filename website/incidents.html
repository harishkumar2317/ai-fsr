<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Management - AI-FSR</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script>if(!localStorage.getItem('fsr_token'))window.location.href='login.html';</script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="row">
      <div></div>
      <button class="btn btn-primary" onclick="toast('Incident form coming soon')">+ Report Incident</button>
    </div>

    <div class="grid grid-4" id="incidentStats">
      <div class="stat-card"><div class="stat-num" style="color:var(--primary)">—</div><div class="stat-sub">Total Incidents</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--danger)">—</div><div class="stat-sub">Open</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--warning)">—</div><div class="stat-sub">In Progress</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--success)">—</div><div class="stat-sub">Closed</div></div>
    </div>

    <div class="card mt-3">
      <h3 style="margin-bottom:12px">Incidents</h3>
      <div id="incidentTable">Loading...</div>
    </div>
  </main>
</div>
<script src="api.js"></script>`n<script src="app.js"></script>
<script>
renderShell(7,'Incident Management','Track, assess, and resolve food safety incidents with AI-assisted risk analysis','Incidents');

async function loadIncidents(){
  const el=document.getElementById('incidentTable');
  try{
    const data=await API.incidents.list();
    const incidents=data.incidents||[];
    const total=incidents.length;
    const open=incidents.filter(i=>i.status==='Open').length;
    const prog=incidents.filter(i=>i.status==='In Progress').length;
    const closed=incidents.filter(i=>i.status==='Closed').length;
    const stats=document.querySelectorAll('#incidentStats .stat-num');
    if(stats[0])stats[0].textContent=total;
    if(stats[1])stats[1].textContent=open;
    if(stats[2])stats[2].textContent=prog;
    if(stats[3])stats[3].textContent=closed;
    if(!incidents.length){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted-foreground)">No incidents found for your organization</div>';return;}
    el.innerHTML=`<table><tr><th>ID</th><th>Title</th><th>Severity</th><th>Reported By</th><th>Date</th><th>Status</th></tr>${incidents.map(i=>{
      const sevCls=i.severity==='Critical'||i.severity==='High'?'red':i.severity==='Medium'?'yellow':'green';
      const stCls=i.status==='Open'?'red':i.status==='In Progress'?'yellow':'green';
      return `<tr><td style="color:var(--primary);font-weight:500">INC-${i.id}</td><td>${esc(i.title)}</td><td><span class="pill ${sevCls}">${esc(i.severity||'Medium')}</span></td><td>${esc(i.reported_by||'')}</td><td>${esc(i.date||i.created_at||'')}</td><td><span class="pill ${stCls}">${esc(i.status||'Open')}</span></td></tr>`;
    }).join('')}</table>`;
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--danger)">Failed to load incidents</div>';}
}
function esc(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadIncidents();
</script>
</body>
</html>
