<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPA Management - AI-FSR</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script>if(!localStorage.getItem('fsr_token'))window.location.href='login.html';</script>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" onclick="closeMobileMenu()"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="row">
      <div></div>
      <button class="btn btn-primary" onclick="toast('CAPA form coming soon')">+ New CAPA</button>
    </div>

    <div class="grid grid-4" id="capaStats">
      <div class="stat-card"><div class="stat-num" style="color:var(--danger)">—</div><div class="stat-sub">Open</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--warning)">—</div><div class="stat-sub">In Progress</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--success)">—</div><div class="stat-sub">Closed</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--muted-foreground)">—</div><div class="stat-sub">Total</div></div>
    </div>

    <div class="card mt-3">
      <h3 style="margin-bottom:12px">All CAPA Actions</h3>
      <div id="capaTable">Loading...</div>
    </div>
  </main>
</div>
<script src="api.js"></script>`n<script src="app.js"></script>
<script>
renderShell(8,'CAPA Management','Corrective and Preventive Actions — track, assign, verify, and close','Capa');

async function loadCapa(){
  const el=document.getElementById('capaTable');
  try{
    const data=await API.capa.list();
    const capas=data.capa||data.actions||[];
    const open=capas.filter(c=>c.status==='Open').length;
    const prog=capas.filter(c=>c.status==='In Progress').length;
    const closed=capas.filter(c=>c.status==='Closed').length;
    const stats=document.querySelectorAll('#capaStats .stat-num');
    if(stats[0])stats[0].textContent=open;
    if(stats[1])stats[1].textContent=prog;
    if(stats[2])stats[2].textContent=closed;
    if(stats[3])stats[3].textContent=capas.length;
    if(!capas.length){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted-foreground)">No CAPA actions found for your organization</div>';return;}
    el.innerHTML=`<table><tr><th>CAPA ID</th><th>Title</th><th>Assignee</th><th>Due Date</th><th>Priority</th><th>Status</th></tr>${capas.map(c=>{
      const prCls=c.priority==='High'||c.priority==='Critical'?'red':c.priority==='Medium'?'yellow':'green';
      const stCls=c.status==='Open'?'red':c.status==='In Progress'?'yellow':'green';
      return `<tr><td style="color:var(--primary);font-weight:500">CAPA-${c.id}</td><td>${esc(c.title)}</td><td>${esc(c.assignee||'')}</td><td>${esc(c.due_date||'')}</td><td><span class="pill ${prCls}">${esc(c.priority||'Medium')}</span></td><td><span class="pill ${stCls}">${esc(c.status||'Open')}</span></td></tr>`;
    }).join('')}</table>`;
  }catch(e){el.innerHTML='<div style="padding:20px;color:var(--danger)">Failed to load CAPA actions</div>';}
}
function esc(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
loadCapa();
</script>
</body>
</html>
